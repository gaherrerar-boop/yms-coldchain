<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WAS ON</title>
<style>
/* ════════════════════════════════════════════════════════════════════
   GESTIÓN DE SLOTTING DE CÁMARAS · estética de software empresarial
   clásico: barra azul, paneles grises, controles biselados, Tahoma.
════════════════════════════════════════════════════════════════════ */
:root{
  --face:#ece9e2;          /* gris de panel */
  --face2:#f4f2ec;
  --edgeL:#ffffff;         /* bisel claro */
  --edgeD:#8f8b82;         /* bisel oscuro */
  --edgeD2:#5c5952;
  --line:#b9b5aa;
  --ink:#1c1c1c; --ink2:#5a5a5a;
  --blue:#0b3d91; --blue2:#1d5bbf; --blueT:#dce8f8;
  --sel:#2a63c8;
  --ok:#1d7a3a; --warn:#b33a2a;
  --paper:#ffffff;
  --pasillo:#efe9dc;       /* beige cálido pasillos */
  --pilar:#9aa0a6;         /* gris estructural */
  --entrada:#0b52d6;       /* azul intenso */
  --cw:56px; --ch:40px; --cf:9px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:Tahoma,"Segoe UI",Arial,sans-serif;font-size:12px;color:var(--ink);
  background:var(--face);display:flex;flex-direction:column;overflow:hidden;
}
button,input,select,textarea{font-family:inherit;font-size:12px;color:var(--ink)}
input[type=text],input[type=search],textarea,select{
  background:#fff;border:1px solid;border-color:var(--edgeD) var(--edgeL) var(--edgeL) var(--edgeD);
  padding:2px 5px;border-radius:0;
}
input:focus,select:focus,textarea:focus{outline:1px dotted var(--blue);outline-offset:-3px}
::-webkit-scrollbar{width:14px;height:14px}
::-webkit-scrollbar-track{background:#dedbd2}
::-webkit-scrollbar-thumb{background:var(--face);border:1px solid;border-color:var(--edgeL) var(--edgeD) var(--edgeD) var(--edgeL)}

/* ─── botón clásico biselado ─── */
.tbtn,.dbtn,.ibtn,.mbtn{
  background:var(--face);border:1px solid;cursor:pointer;
  border-color:var(--edgeL) var(--edgeD) var(--edgeD) var(--edgeL);
  padding:3px 9px;border-radius:0;white-space:nowrap;line-height:1.25;
}
.tbtn:active,.dbtn:active,.ibtn:active,.mbtn:active{border-color:var(--edgeD) var(--edgeL) var(--edgeL) var(--edgeD)}
.tbtn.on{background:#dcd8ce;border-color:var(--edgeD) var(--edgeL) var(--edgeL) var(--edgeD);box-shadow:inset 1px 1px 0 rgba(0,0,0,.08);font-weight:700}
.tbtn:disabled,.dbtn:disabled{color:#9a968c;text-shadow:1px 1px 0 #fff;cursor:default;border-color:var(--edgeL) var(--edgeD) var(--edgeD) var(--edgeL)}
.tbtn.ico{padding:3px 7px;min-width:24px;text-align:center}
.tbtn.tg{padding:3px 7px;font-size:11px;color:#6b675d}
.tbtn.tg.on{color:var(--ink)}
.tbtn.tg .led{display:inline-block;width:7px;height:7px;margin-right:4px;background:#b9b5aa;border:1px solid var(--edgeD);vertical-align:0}
.tbtn.tg.on .led{background:#2fbf4a;border-color:#1d7a3a}

/* ─── barra de título azul ─── */
.titlebar{
  height:32px;display:flex;align-items:center;gap:8px;padding:0 8px;flex:none;
  background:linear-gradient(180deg,#2d63b8 0%,#0b3d91 55%,#082e70 100%);
  color:#fff;border-bottom:1px solid #04204f;
}
.titlebar .appicon{width:18px;height:18px;background:#fff;color:var(--blue);font-size:12px;line-height:17px;text-align:center;font-weight:700;border:1px solid #04204f;border-radius:2px}
.titlebar .ttl{font-weight:700;font-size:12.5px;letter-spacing:.2px;text-shadow:1px 1px 0 rgba(0,0,0,.4)}
.titlebar .tcam{font-size:11.5px;color:#cfe0f8}
.sp{flex:1}
.savestate{font-size:11px;color:#cfe0f8;display:flex;align-items:center;gap:5px}
.savestate .dot{width:8px;height:8px;border-radius:50%;background:#3ddc84;border:1px solid rgba(0,0,0,.35)}
.savestate.dirty{color:#ffd98a}
.savestate.dirty .dot{background:#f5a623}
.userbadge{display:inline-flex;align-items:center;height:20px;padding:0 7px;border:1px solid rgba(255,255,255,.45);border-radius:2px;background:rgba(255,255,255,.12);color:#eaf2ff;font-size:10px;font-weight:700}
.btnUsers{height:22px;padding:0 8px;border:1px solid #c9d8ef;border-radius:2px;background:#f5f8fc;color:#173d70;font-size:10px;font-weight:700;cursor:pointer}
.viewer #btnSave,.viewer #modeEdit,.viewer #tabPlus,.viewer .adminonly,.viewer .mroot[data-m="config"],.viewer #btnHeatConfig{display:none!important}
.viewer .modeseg{display:none}.viewer .modebadge{margin-right:4px}
.userform{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;align-items:end;margin-bottom:12px;padding:10px;border:1px solid var(--line);background:var(--face2)}
.userform label{display:grid;gap:4px;color:var(--ink2);font-size:10px;font-weight:700}.userform input{height:28px;padding:0 7px;border:1px solid #8c9aaa;background:#fff;color:var(--ink)}
.userlist{display:grid;gap:5px}.userrow{display:grid;grid-template-columns:minmax(110px,1fr) 110px minmax(150px,auto);gap:8px;align-items:center;padding:8px;border:1px solid var(--line);background:#fff;font-size:11px}
.userrow .role{color:var(--ink2);font-size:10px}.userActions{display:flex;justify-content:flex-end;gap:5px;flex-wrap:wrap}
@media(max-width:650px){.userform{grid-template-columns:1fr}.userrow{grid-template-columns:1fr auto}.userrow .role{grid-column:1}}
.btnSave{
  background:linear-gradient(180deg,#f7f5ef,#d9d5ca);border:1px solid;cursor:pointer;
  border-color:var(--edgeL) var(--edgeD2) var(--edgeD2) var(--edgeL);
  padding:3px 16px;font-weight:700;border-radius:2px;
}
.btnSave:active{border-color:var(--edgeD2) var(--edgeL) var(--edgeL) var(--edgeD2)}
.btnSave.pulse{outline:2px solid #ffd98a}

/* ─── barra de menú ─── */
.menubar{height:24px;display:flex;align-items:stretch;background:var(--face);border-bottom:1px solid var(--line);flex:none;position:relative;z-index:120}
.mroot{padding:4px 10px;cursor:default;user-select:none}
.mroot:hover,.mroot.open{background:var(--sel);color:#fff}
.mdrop{
  position:absolute;top:24px;display:none;min-width:250px;background:var(--face2);
  border:1px solid var(--edgeD2);box-shadow:2px 2px 0 rgba(0,0,0,.28);padding:2px;z-index:130;
}
.mdrop button{display:block;width:100%;text-align:left;background:none;border:none;padding:4px 22px 4px 26px;cursor:default;position:relative;white-space:nowrap}
.mdrop button:hover:not(:disabled){background:var(--sel);color:#fff}
.mdrop button:disabled{color:#9a968c;text-shadow:1px 1px 0 #fff}
.mdrop button .chk{position:absolute;left:8px}
.mdrop button .acc{float:right;color:#7a766c;margin-left:24px}
.mdrop button:hover:not(:disabled) .acc{color:#dfe9fb}
.mdrop hr{border:none;border-top:1px solid var(--line);border-bottom:1px solid #fff;margin:3px 2px}

/* ─── pestañas de cámaras + modo ─── */
.tabbar{display:flex;align-items:flex-end;gap:2px;padding:5px 8px 0;background:var(--face);border-bottom:1px solid var(--edgeD);flex:none}
.tab{
  background:#dedbd2;border:1px solid var(--edgeD);border-bottom:none;cursor:pointer;
  padding:4px 14px 5px;border-radius:4px 4px 0 0;color:#454239;position:relative;top:0;
}
.tab.on{background:var(--face2);font-weight:700;color:var(--ink);padding-bottom:7px;margin-bottom:-1px;border-color:var(--edgeD);box-shadow:inset 0 2px 0 var(--blue2)}
.tab.plus{padding:4px 10px 5px;color:var(--blue);font-weight:700}
.modeseg{display:flex;margin-bottom:4px}
.modeseg button{
  border:1px solid;border-color:var(--edgeL) var(--edgeD) var(--edgeD) var(--edgeL);
  background:var(--face);padding:3px 14px;cursor:pointer;font-size:11.5px;
}
.modeseg button+button{border-left:none}
.modeseg button.on{background:var(--blue);color:#fff;font-weight:700;border-color:#04204f}
body.editmode .modeseg #modeEdit.on{background:#8a5a10;border-color:#5c3a06}
.modebadge{font-size:10.5px;padding:2px 8px;margin:0 8px 5px 0;border:1px solid;align-self:center}
.modebadge.view{background:#e3edfb;border-color:#9db8dd;color:#0b3d91}
.modebadge.edit{background:#fdf1d8;border-color:#d9b263;color:#7a4c07}

/* ─── barra de herramientas ─── */
.toolbar{
  display:flex;align-items:center;gap:6px;padding:4px 8px;flex:none;flex-wrap:nowrap;overflow-x:auto;
  background:linear-gradient(180deg,#f6f4ee,var(--face));border-bottom:1px solid var(--line);min-height:34px;
}
.tgrp{display:flex;align-items:center;gap:3px}
.tdiv{width:1px;align-self:stretch;margin:2px 3px;border-left:1px solid var(--edgeD);border-right:1px solid var(--edgeL)}
.editonly{display:none!important}
body.editmode .editonly{display:flex!important}
body.editmode .editonly.tdiv{display:block!important}
#palette{gap:4px;align-items:center;flex-wrap:nowrap}
.chip{
  display:flex;align-items:center;gap:5px;padding:2px 8px;cursor:pointer;font-size:11px;
  background:var(--face);border:1px solid;border-color:var(--edgeL) var(--edgeD) var(--edgeD) var(--edgeL);
}
.chip.on{background:#dcd8ce;border-color:var(--edgeD) var(--edgeL) var(--edgeL) var(--edgeD);font-weight:700;box-shadow:inset 1px 1px 0 rgba(0,0,0,.08)}
.chip .sw{width:11px;height:11px;border:1px solid rgba(0,0,0,.4)}
#searchBox{width:170px}
.scnt{font-size:11px;color:var(--ink2);min-width:44px;text-align:center}

/* ─── zona central ─── */
.main{flex:1;display:flex;min-height:0;position:relative}
.gridWrap{flex:1;overflow:auto;background:#cfd4da;padding:12px;position:relative}
.camHead{display:flex;align-items:baseline;gap:12px;margin:0 0 8px 2px}
.camHead h1{font-size:14px;color:#233}
.camHead .sub{font-size:11px;color:#495260}
.gridCard{
  position:relative;display:inline-block;min-width:calc(100% - 4px);
  background:var(--paper);border:1px solid var(--edgeD2);box-shadow:2px 2px 0 rgba(0,0,0,.22);
  padding:10px 12px 8px;border-radius:2px;
}
.layoutCanvas{position:relative;display:inline-block;width:max-content;max-width:none;vertical-align:top;overflow:hidden}
.layoutContent{position:relative;display:inline-block;min-width:max-content;vertical-align:top}
#flowSvg{position:absolute;left:0;top:0;pointer-events:none;z-index:30;overflow:hidden}
#flowSvg.editing{pointer-events:auto;touch-action:none}
#flowSvg .flowConnectorLine{pointer-events:none}
#flowSvg .arrowHit{pointer-events:stroke;cursor:move;stroke:transparent;stroke-width:16}
#flowSvg .arrowHandle{pointer-events:all;cursor:grab;filter:drop-shadow(0 1px 2px rgba(16,24,40,.28))}
#flowSvg .curveGuide{pointer-events:none;fill:none;stroke:#93c5fd;stroke-width:1.5;stroke-dasharray:4 3}
#flowSvg .curveHandle{pointer-events:all;cursor:crosshair;filter:drop-shadow(0 1px 2px rgba(16,24,40,.28))}
#flowSvg .connectorLabel{font-size:8px;font-weight:800;letter-spacing:.35px;paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round;pointer-events:none}
#flowSvg .directionLabel{font-size:10px;font-weight:900;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round;pointer-events:none}
#flowSvg .snapRing{pointer-events:none;fill:none;stroke:#2563eb;stroke-width:2;stroke-dasharray:3 2;opacity:.72}
#flowSvg.dragging,#flowSvg.dragging .arrowHit,#flowSvg.dragging .arrowHandle,#flowSvg.dragging .curveHandle{cursor:grabbing}

.rackBlock{
  border:1px solid #7d838c;background:#f2f4f6;margin:7px 0;position:relative;border-radius:2px;
  padding:14px 4px 4px;box-shadow:inset 0 0 0 1px #fff;
}
.rkTag{
  position:absolute;top:-1px;left:-1px;font-size:9.5px;font-weight:700;letter-spacing:.5px;
  background:#5b6470;color:#fff;padding:1px 8px 2px;border-radius:2px 0 3px 0;z-index:6;
}
.rkTag .b{font-weight:400;color:#c9d2dd}
.pasRow{margin:5px 0;padding:2px;border:1px solid #d0d5dd;border-radius:3px;background:#eef1f4;box-shadow:inset 0 1px 0 rgba(255,255,255,.85)}
.grow{display:flex;align-items:stretch}
.rlabel{
  flex:none;width:86px;display:flex;align-items:center;gap:3px;padding:0 4px;
  font-size:9px;font-weight:700;color:#3c434c;letter-spacing:.3px;
  position:sticky;left:0;z-index:5;background:inherit;
}
.rackBlock .rlabel{background:#f2f4f6}
.grow.pas{position:relative;border-radius:2px;background:#e4e7ec;transition:background .12s,box-shadow .12s}
.grow.pas .rlabel{background:#e4e7ec;color:#475467;cursor:pointer}
.grow.pas .cell{height:calc(var(--ch)*.48);min-height:18px;margin-top:0;margin-bottom:0}
.grow.reserveRowHidden .rlabel{visibility:hidden;pointer-events:none}
.grow.pas.heatAisle{background:var(--aisle-heat,#fff3a3);box-shadow:inset 0 0 0 2px rgba(71,84,103,.18),0 0 14px var(--aisle-heat,#fff3a3)}
.grow.pas.heatAisle .rlabel{background:var(--aisle-heat,#fff3a3)!important;color:#344054}
.grow.pas.aisleSelected{z-index:8;background:#cfd5dc;box-shadow:inset 0 0 0 2px #475467,0 2px 5px rgba(16,24,40,.16)}
.grow.pas.aisleSelected .rlabel{background:#cfd5dc;color:#101828}
.grow.pas.aisleSelected:before,.grow.pas.aisleSelected:after{content:"";position:absolute;top:50%;z-index:12;width:8px;height:16px;border:1px solid #667085;background:#fff;transform:translateY(-50%)}
.grow.pas.aisleSelected:before{left:84px}.grow.pas.aisleSelected:after{right:1px}
.rlabel .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.gear{flex:none;border:none;background:none;cursor:pointer;font-size:10px;color:#8a919b;padding:0 1px;display:none}
body.editmode .gear{display:inline}
.gear:hover{color:var(--blue)}

.cell{
  flex:none;width:var(--cw);height:var(--ch);border:1px solid #c4c9cf;margin:1px;
  display:flex;align-items:center;justify-content:center;text-align:center;
  font-size:var(--cf);font-weight:700;letter-spacing:.2px;position:relative;cursor:default;
  user-select:none;border-radius:1px;overflow:hidden;
}
.cell.void{border-color:transparent;background:transparent}
.cell.empty{background:#fbfbf9;border-style:dashed;border-color:#d3d0c7}
.cell.pas{background:transparent;border-color:transparent;color:#667085;font-size:calc(var(--cf) - .5px);font-weight:700;letter-spacing:.4px}
.cell.pas.heatPassCell{background:var(--aisle-heat,#fff3a3)!important;border-color:transparent!important;border-radius:9px;color:#344054}
.cell.zone{background:#e2e5e9;border-color:#aab0b8;color:#3c434c}
.cell.zone.entrada{background:var(--entrada);border-color:#063a99;color:#fff;letter-spacing:.6px}
.cell.zone.pilar{
  background:var(--pilar);border-color:#6d747c;color:#2f353c;
  background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.28) 0 2px,transparent 2px 6px);
}
.cell.loc{color:#fff;border-color:rgba(0,0,0,.28)}
.cell.loc.pickerPending{z-index:9;outline:3px solid #f04438;outline-offset:-2px;box-shadow:0 0 0 2px #fffaeb,0 0 12px rgba(240,68,56,.65)!important}
.cell.loc.pickerPending:after{content:"!";position:absolute;right:1px;top:1px;z-index:8;width:11px;height:11px;border-radius:50%;background:#f04438;color:#fff;font-size:8px;line-height:11px;text-align:center;box-shadow:0 1px 2px rgba(16,24,40,.3)}
.cell.loc.rsv{border-color:rgba(16,24,40,.28)!important;background:#3a424b!important;color:#fff!important;clip-path:none;box-shadow:0 0 0 1px rgba(255,255,255,.12) inset;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.08) 0 3px,transparent 3px 8px)!important}
.cell.reserveHidden{visibility:hidden;pointer-events:none}
.cell.sel{outline:2px solid #ff2d78;outline-offset:-1px;z-index:4}
.cell.hit{outline:2px dashed #ff9500;outline-offset:-1px}
.cell.hitCur{outline:3px solid #ff9500;outline-offset:-1px;z-index:4}
.cell.dim{opacity:.16;filter:grayscale(.6)}
body.editmode .cell.paintable{cursor:crosshair}
body.editmode .cell.flowable{cursor:cell}
.cell.pilL{border-left:3px solid #59616b}
.cell.pilR{border-right:3px solid #59616b}
.cell .code{overflow:hidden;text-overflow:clip;padding:0 1px}
body.nocodes .cell .code{visibility:hidden}
.cell.loc.hasSku .code{position:absolute;top:1px;left:8px;right:8px;height:10px;line-height:10px;z-index:2;white-space:nowrap}
.skuPop{position:absolute;left:2px;right:2px;top:13px;bottom:2px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;z-index:2}
.skuPop.count1,.skuPop.count2{grid-template-columns:1fr}
.skuPopItem{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 1px;background:rgba(255,255,255,.92);border:1px solid rgba(0,0,0,.32);color:#14213d;font-size:max(5px,calc(var(--cf) - 2.5px));line-height:1.05;letter-spacing:0;text-shadow:none}
.cell.loc.recPreview .skuPopItem{background:#fff3c8;border-color:#9d7a16;color:#4e3a00}
.mRec{position:absolute;right:1px;top:1px;z-index:4;padding:0 2px;border:1px solid #7b5c08;background:#fff3c8;color:#5b4300;font-size:max(4px,calc(var(--cf) - 4px));line-height:1.15;text-shadow:none}
body.nosku .skuPop{display:none}
body.nosku .cell.loc.hasSku .code{top:50%;left:1px;right:1px;transform:translateY(-50%)}
.tsym{position:absolute;left:1px;bottom:-1px;font-size:calc(var(--cf) + 1px);font-weight:400;opacity:.95;line-height:1}
.cell.loc.hasSku .tsym{left:1px;top:0;bottom:auto;z-index:3}
.mSin{position:absolute;top:0;right:0;width:0;height:0;border-left:7px solid transparent;border-top:7px solid #e21b1b}
.mQui{position:absolute;right:1px;bottom:1px;width:6px;height:6px;border-radius:50%;background:#2fbf4a;border:1px solid #0d5a22}
.mSku{position:absolute;top:1px;left:1px;width:5px;height:5px;background:#fff;border:1px solid rgba(0,0,0,.5)}
body.noalerts .mSin,body.noalerts .mQui{display:none}
body.nosku .mSku{display:none}

/* leyenda */
.legendStrip{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-top:9px;padding:5px 7px;background:var(--face2);border:1px solid var(--line);font-size:10.5px}
.legendStrip .cap{font-weight:700;color:var(--ink2);margin-right:2px}
.lg{display:flex;align-items:center;gap:4px;padding:1px 6px;border:1px solid transparent;cursor:pointer;user-select:none}
.lg:hover{border-color:var(--edgeD)}
.lg.fon{background:#dcd8ce;border-color:var(--edgeD) var(--edgeL) var(--edgeL) var(--edgeD);font-weight:700}
.lg .sw{width:11px;height:11px;border:1px solid rgba(0,0,0,.4);position:relative}
.lg .sw.rsvsw{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.16) 0 2px,transparent 2px 5px)}
.lg .pilSw{width:11px;height:11px;background:var(--pilar);border:1px solid #6d747c;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.3) 0 2px,transparent 2px 5px)}
.lg .pasSw{width:11px;height:11px;background:var(--pasillo);border:1px solid #ddd3bd}
.lg .entSw{width:11px;height:11px;background:var(--entrada);border:1px solid #063a99}
.lg .arrSw{width:18px;height:10px;position:relative}
.lg .arrSw:before{content:"";position:absolute;left:0;right:5px;top:4px;height:2px;background:#aeb8c4}
.lg .arrSw:after{content:"";position:absolute;right:0;top:1px;border-left:7px solid #aeb8c4;border-top:4px solid transparent;border-bottom:4px solid transparent}
.lg .triSin{width:0;height:0;border-left:8px solid transparent;border-top:8px solid #e21b1b}
.lg .cirQui{width:8px;height:8px;border-radius:50%;background:#2fbf4a;border:1px solid #0d5a22}
.lg .n{color:var(--ink2);font-weight:400}

/* ─── inspector lateral ─── */
.inspector{
  flex:none;width:0;overflow:hidden;background:var(--face);border-left:1px solid var(--edgeD2);
  transition:width .12s;display:flex;flex-direction:column;
}
.inspector.open{width:272px}
.insTitle{
  flex:none;background:linear-gradient(180deg,#2d63b8,#0b3d91);color:#fff;font-weight:700;font-size:11.5px;
  padding:4px 8px;display:flex;align-items:center;letter-spacing:.2px;
}
.insTitle .x{margin-left:auto;background:var(--face);border:1px solid;border-color:var(--edgeL) var(--edgeD2) var(--edgeD2) var(--edgeL);width:17px;height:16px;line-height:13px;font-size:10px;cursor:pointer;color:#000;text-align:center;padding:0}
.insBody{flex:1;overflow-y:auto;padding:8px}
.fset{border:1px solid var(--line);padding:7px 8px 8px;margin:0 0 8px;background:var(--face2)}
.fset legend{font-size:10.5px;font-weight:700;color:#4a463c;padding:0 4px}

/* ─── AGROSUPER 2026 · capa visual corporativa (sin cambios funcionales) ─── */
:root{
  --brand-blue:#003087;--brand-orange:#e87722;--brand-ivory:#fff6e6;--brand-white:#fff;
  --face:#fff;--face2:#fff6e6;--edgeL:#fff;--edgeD:rgba(0,48,135,.22);--edgeD2:rgba(0,48,135,.42);
  --line:rgba(0,48,135,.13);--ink:#003087;--ink2:rgba(0,48,135,.68);--blue:#003087;--blue2:#003087;
  --blueT:#fff6e6;--sel:#003087;--paper:#fff;--pasillo:#fff6e6;
}
body{font-family:Poppins,Montserrat,"Segoe UI",Arial,sans-serif;background:var(--brand-ivory);color:var(--brand-blue)}
button,input,select,textarea{color:var(--brand-blue)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid rgba(232,119,34,.35);outline-offset:2px}
input[type=text],input[type=search],textarea,select{border-color:rgba(0,48,135,.22);color:var(--brand-blue);box-shadow:0 1px 2px rgba(0,48,135,.05)}
input[type=text]:hover,input[type=search]:hover,textarea:hover,select:hover{border-color:rgba(0,48,135,.42)}
input:focus,select:focus,textarea:focus{border-color:var(--brand-blue);box-shadow:0 0 0 3px rgba(0,48,135,.1)}
::-webkit-scrollbar-track{background:var(--brand-ivory)}::-webkit-scrollbar-thumb{background:rgba(0,48,135,.24);border-color:var(--brand-ivory)}

function firstReserveCode(code){
  const m=/^([A-Za-z]+)(\d)0(\d+)$/.exec(String(code||''));
  return m?m[1]+m[2]+'1'+m[3]:String(code||'')+'-R1';
}
function addFirstReserveRows(cm){
  if(!cm||!Array.isArray(cm.rows)) return false;
  if(cm.rows.some(row=>(row.cells||[]).some(cell=>cell&&cell.k==='loc'&&cell.t==='reserva'))) return false;
  const usedCodes=new Set(cm.rows.flatMap(row=>row.cells||[]).filter(cell=>cell&&cell.k==='loc'&&cell.code).map(cell=>String(cell.code)));
  const reserveCode=source=>{
    let candidate=firstReserveCode(source);
    if(usedCodes.has(candidate)) candidate=String(source||'RESERVA')+'-R1';
    let unique=candidate,n=2;while(usedCodes.has(unique)) unique=candidate+'-'+n++;
    usedCodes.add(unique);return unique;
  };
  const expanded=[];
  cm.rows.forEach(row=>{
    expanded.push(row);
    if(row.kind!=='rack') return;
    expanded.push({kind:'rack',label:'RESERVA 1ER',cells:(row.cells||[]).map(cell=>{
      if(!cell||cell.k==='empty') return cell===null?null:{k:'empty'};
      if(cell.k!=='loc') return cell;
      return {k:'loc',code:reserveCode(cell.code),skus:[],fl:{},t:'reserva'};
    })});
  });
  cm.rows=expanded;
  cm.arrows=defaultArrows(1);
  return true;
}

let dirty=false, dirtyRevision=0, lastSaved=null, lastSavedBy='';

function stateForPersistence(source=state){

}

async function persist(options={}){
  if(!canEdit()){ toast('Tu usuario es sólo visualizador'); return false; }
  if(persistInFlight){ persistAgain=true; return true; }
  clearTimeout(autoSaveTimer);
  persistInFlight=true;

    const response=await fetch('/api/state',{method:'PUT',credentials:'include',headers:{'content-type':'application/json'},body:JSON.stringify({state:persistedState})});

    if(response.status===401){ window.top.location='/'; return false; }
    if(!response.ok) throw new Error(data.error||'Error de conexión');
    localStorage.setItem(LS_KEY,payload);
    dirty=dirtyRevision!==saveRevision;
    lastSaved=new Date(data.updatedAt||Date.now());
    lastSavedBy=data.updatedBy||authUser.username;
    cloudHasState=true;
    engineDirty=false;
    updateSaveUI();

    if(!options.silentSuccess) toast((state.palletSimulation?.results||[]).length?'Parametrización guardada; la simulación permanece en esta sesión':'Cambios guardados en ChatGPT Sites','ok');

}

/* Deriva el código de un nivel de reserva a partir del código N1
   (segundo dígito = nivel): D1128 → N3 = D1328. Devuelve null si el

function resLevelCode(code,lvl){
  const m=/^([A-Za-z]+)(\d)(\d)(\d+)$/.exec(code||'');
  if(!m||m[3]!=='1'||lvl>9) return null;
  return m[1]+m[2]+String(lvl)+m[4];
}

function rackSegments(){
  const rows=cam().rows, segs=[]; let i=0;
  while(i<rows.length){
    if(rows[i].kind==='rack'){
      let j=i; while(j<rows.length&&rows[j].kind==='rack') j++;
      for(let k=i;k<j;k+=2) segs.push({kind:'rack', rows:[k, (k+1<j)?k+1:null].filter(x=>x!==null)});
      i=j;
    }else{ segs.push({kind:rows[i].kind, rows:[i]}); i++; }
  }
  return segs;
}
function rackLetter(seg){
  const cnt={};
  seg.rows.forEach(ri=>cam().rows[ri].cells.forEach(c=>{
    if(c&&c.k==='loc'&&c.code){ const L=c.code[0]; if(/[A-Z]/.test(L)) cnt[L]=(cnt[L]||0)+1; }
  }));
  const best=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
  return best?best[0]:'';
}
function bayBounds(seg){
  const cols=nCols(), size=Math.max(1,cam().baySize||2);
  const occ=Array(cols).fill(false);
  seg.rows.forEach(ri=>cam().rows[ri].cells.forEach((c,ci)=>{ if(c&&c.k==='loc') occ[ci]=true; }));
  const pilL=new Set(), pilR=new Set();
  let s=-1;
  for(let c=0;c<=cols;c++){
    const on=c<cols&&occ[c];
    if(on&&s<0) s=c;
    if(!on&&s>=0){ for(let k=s;k<c;k+=size) pilL.add(k); pilR.add(c-1); s=-1; }
  }
  return {pilL,pilR};
}
function segOf(r){ return rackSegments().find(s=>s.rows.includes(r)); }
function pasilloOf(r,c){
  const rows=cam().rows;

    for(let i=r+dir;i>=0&&i<rows.length;i+=dir){
      if(rows[i].kind==='pas'){
        let best='',bd=1e9;
        rows[i].cells.forEach((cl,ci)=>{ if(cl&&cl.label){ const d=Math.abs(ci-c); if(d<bd){bd=d;best=cl.label;} } });
        if(best) return best;
        break;
      }
    }
  }
  return '—';
}

      else (byCode[code]=byCode[code]||[]).push({r,c:ci});
      if(!state.types.some(t=>t.id===c.t))
        issues.push({kind:'badtype', msg:`Tipo inexistente «${c.t}» en ${code||'(sin código)'}`, at:[{r,c:ci}]});
      const s=(c.skus||[]).filter(x=>x&&String(x).trim());
      const maxSku=skuCapacityForType(c.t);
      if(s.length>maxSku) issues.push({kind:'overcap', msg:`${code||'(sin código)'} admite ${maxSku} SKU y contiene ${s.length}`, at:[{r,c:ci}]});
    }
  }));
  Object.entries(byCode).forEach(([code,at])=>{
    if(at.length>1) issues.push({kind:'dup', msg:`Código duplicado ${code} — ${at.length} celdas`, at});
  });
  (cm.arrows||[]).forEach((A,i)=>{
    const bad=p=>{
      if(!p) return true;
      if(Number.isFinite(p.x)&&Number.isFinite(p.y)) return p.x<0||p.x>1||p.y<0||p.y>1;
      return !cm.rows[p.r]||!cm.rows[p.r].cells||cm.rows[p.r].cells[p.c]===undefined||cm.rows[p.r].cells[p.c]===null;
    };
    if(bad(A.a)||bad(A.b)) issues.push({kind:'badarrow', msg:`Flecha ${i+1} con un extremo fuera del plano o anclado a una celda inexistente`, arrow:i});
  });
  validateFlowGraph(cm).errors.forEach(msg=>issues.push({kind:'flow',msg:'Recorrido: '+msg}));
  structIssues.forEach(m=>issues.push({kind:'struct', msg:m}));
  return issues;
}
function validateStructure(s){
  const errs=[];
  if(!s||!Array.isArray(s.cams)||!s.cams.length){ errs.push('El JSON no contiene cámaras (cams).'); return errs; }
  s.cams.forEach((cm,i)=>{
    const n=cm&&cm.name?cm.name:('cámara '+(i+1));
    if(!cm||typeof cm!=='object'){ errs.push(`Entrada inválida en cams[${i}].`); return; }
    if(!cm.name) errs.push(`${n}: sin nombre.`);
    if(!Array.isArray(cm.rows)){ errs.push(`${n}: no tiene filas (rows).`); return; }
    cm.rows.forEach((row,ri)=>{
      if(!row||!Array.isArray(row.cells)){ errs.push(`${n}: fila ${ri+1} sin celdas.`); return; }
      if(!['rack','pas','free'].includes(row.kind)) errs.push(`${n}: fila ${ri+1} con tipo de fila desconocido «${row.kind}».`);
      row.cells.forEach((c,ci)=>{
        if(c&&!['loc','zone','pas','empty'].includes(c.k))
          errs.push(`${n}: celda fila ${ri+1}, col ${ci+1} con clase desconocida «${c.k}».`);
      });
    });
  });
  return errs;
}

function cellMatchesFilter(c){
  if(!filterSet.size) return true;
  if(!c||c.k!=='loc') return true;
  if(filterSet.has(c.t)) return true;
  if(c.fl&&c.fl.sinEtiqueta&&filterSet.has('sinEtiqueta')) return true;
  if(c.fl&&c.fl.quitar&&filterSet.has('quitar')) return true;
  return false;
}
function matchSearch(c){
  const q=searchTerm.toLowerCase();
  return (c.code||'').toLowerCase().includes(q) || (c.skus||[]).some(s=>String(s||'').toLowerCase().includes(q));
}
function buildRecommendationSlotLookup(cameraIndex){
  const run=cameraRun(cameraIndex);
  if(!run||run.layoutSignature!==engineLayoutSignature(cameraIndex)||run.restrictionSignature!==engineRestrictionSignature(cameraIndex)) return null;
  const slots=new Map();
  (engineState.recommendations||[])
    .filter(rec=>Number(rec.cameraIndex)===Number(cameraIndex))
    .forEach(rec=>(rec.locations||[]).forEach(loc=>{
      if(Number(loc.cameraIndex)!==Number(cameraIndex)) return;
      const key=`${Number(loc.row)}:${Number(loc.column)}`,index=Number(loc.subslotIndex)-1;
      if(index<0) return;
      if(!slots.has(key)) slots.set(key,new Map());
      slots.get(key).set(index,String(rec.sku||''));
    }));
  return {cameraIndex:Number(cameraIndex),run,slots};
}
function recommendationSlotsForCell(cameraIndex,row,column,cell){
  if(!cell||cell.k!=='loc'||cell.t==='reserva') return null;
  const run=cameraRun(cameraIndex);
  if(!recommendationRenderContext||recommendationRenderContext.cameraIndex!==Number(cameraIndex)||recommendationRenderContext.run!==run){
    recommendationRenderContext=buildRecommendationSlotLookup(cameraIndex);
  }
  if(!recommendationRenderContext) return null;
  const slots=Array(skuCapacityForType(cell.t)).fill('');
  const recommended=recommendationRenderContext.slots.get(`${Number(row)}:${Number(column)}`);
  if(recommended) recommended.forEach((sku,index)=>{ if(index<slots.length) slots[index]=sku; });
  return slots;
}

function dualAnalysis(cameraIndex){
  const records=heatRecords(cameraIndex),ais=heatAisleSummary(records),aisleMap=new Map(ais.aisles.map(a=>[a.aisle,a]));
  const analysis={records,aisles:ais.aisles,aisleMap};
  const vals=records.map(x=>heatMetricValue(x,analysis)).filter(v=>Number.isFinite(v)&&(heatState.includeZero||v>0));
  analysis.min=vals.length?Math.min(...vals):0;analysis.max=vals.length?Math.max(...vals):0;
  const aisleVals=analysis.aisles.map(heatAisleMetricValue).filter(v=>Number.isFinite(v)&&(heatState.includeZero||v>0));
  analysis.aisleMin=aisleVals.length?Math.min(...aisleVals):0;analysis.aisleMax=aisleVals.length?Math.max(...aisleVals):0;
  analysis.byCell=new Map(records.map(rec=>[rec.row+':'+rec.column,rec]));
  return analysis;
}

function dualPoint(map,p){
  if(!p) return null;
  if(Number.isFinite(p.x)&&Number.isFinite(p.y)) return {x:clamp(p.x,0,1)*map.clientWidth,y:clamp(p.y,0,1)*map.clientHeight};

  const a=map.getBoundingClientRect(),b=cell.getBoundingClientRect();return {x:b.left-a.left+b.width/2,y:b.top-a.top+b.height/2};
}

function onSelect(r,c,e){
  const row=cam().rows[r]; if(!row) return;
  if(row.kind==='pas'&&!e.shiftKey&&!e.ctrlKey&&!e.metaKey){
    sel=(row.cells||[]).map((cell,column)=>cell&&cell.k==='pas'?{r,c:column}:null).filter(Boolean);
    anchor={r,c};
  }else if(e.shiftKey&&anchor&&anchor.r===r){
    const [a,b]=[Math.min(anchor.c,c),Math.max(anchor.c,c)];
    sel=[]; for(let i=a;i<=b;i++){ if(row.cells[i]) sel.push({r,c:i}); }
  }else if(e.ctrlKey||e.metaKey){
    const ix=sel.findIndex(s=>s.r===r&&s.c===c);
    if(ix>=0) sel.splice(ix,1); else sel.push({r,c});
    anchor={r,c};
  }else{
    sel=[{r,c}]; anchor={r,c};
  }
  selArrow=-1;
  render();
}
function applyBrush(r,c,first){
  if(!editing()) return;
  const row=cam().rows[r]; if(!row||row.kind==='pas') return;
  if(first){
    const bn=brush==='empty'?'vaciar':brush==='zone'?'zona':brush==='loc'?'ubicación':typeById(brush).name;
    snap('Pintar «'+bn+'»', 'fila '+(r+1));
  }
  let cell=row.cells[c];
  if(brush==='empty'){ row.cells[c]={k:'empty'}; }
  else if(brush==='zone'){ row.cells[c]={k:'zone',label:(cell&&cell.label)||'ZONA'}; }
  else if(brush==='loc'){
    if(!cell||cell.k!=='loc') row.cells[c]={k:'loc',code:'',t:'simple',skus:[],fl:{}};
  }
  else{
    if(cell&&cell.k==='loc'){ cell.t=brush; }
    else{ row.cells[c]={k:'loc',code:(cell&&cell.code)||'',t:brush,skus:[],fl:{}}; }
  }
  renderGridOnly();
}
function renderGridOnly(){ renderGrid(); redrawOverlays(); }

/* =====================================================================
   BÚSQUEDA con contador y anterior / siguiente
===================================================================== */
function collectHits(){
  searchHits=[];
  if(!searchTerm) return;
  cam().rows.forEach((row,r)=>row.cells.forEach((c,ci)=>{
    if(c&&c.k==='loc'&&(showReserveLocations||c.t!=='reserva')&&matchSearch(c)) searchHits.push({r,c:ci});
  }));
}
function setReserveLocationsVisibility(visible){
  showReserveLocations=Boolean(visible);
  showRes5=showReserveLocations;
  if(!showReserveLocations){
    sel=sel.filter(({r,c})=>{
      const cell=cam().rows[r]&&cam().rows[r].cells[c];
      return !(cell&&cell.k==='loc'&&cell.t==='reserva');
    });
    filterSet.delete('reserva');
  }
  collectHits();
  searchIdx=searchHits.length?Math.min(Math.max(searchIdx,0),searchHits.length-1):-1;
  render();
  renderSearchUI();
}
function toggleReserveLocations(){ openReservations(); }
function setSearch(term){
  searchTerm=term.trim();
  collectHits();
  searchIdx=searchHits.length?0:-1;
  renderGridOnly(); renderSearchUI();
  if(searchIdx>=0) centerHit();
}
function gotoHit(d){
  if(!searchHits.length) return;
  searchIdx=(searchIdx+d+searchHits.length)%searchHits.length;
  renderGridOnly(); renderSearchUI(); centerHit();
}
function centerHit(){
  const h=searchHits[searchIdx]; if(!h) return;
  const el=document.querySelector(`.cell[data-r="${h.r}"][data-c="${h.c}"]`);
  if(el) el.scrollIntoView({block:'center',inline:'center',behavior:'smooth'});
}
function renderSearchUI(){
  $('#srchCnt').textContent=searchTerm?(searchHits.length?`${searchIdx+1} de ${searchHits.length}`:'0 de 0'):'';
  $('#srchPrev').disabled=$('#srchNext').disabled=!searchHits.length;
}

let layoutResizeObserver=null;
function redrawOverlays(){
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ drawFlow(); drawHeatmap(); drawPickerSimulation(); }));
}
function observeLayoutResize(){
  if(layoutResizeObserver) layoutResizeObserver.disconnect();
  const content=$('#layoutContent');
  if(!content||typeof ResizeObserver==='undefined') return;
  layoutResizeObserver=new ResizeObserver(()=>redrawOverlays());
  layoutResizeObserver.observe(content);
}
function applyZoom(z){
  zoom=Math.max(30,Math.min(180,Math.round(z)));
  const r=document.documentElement.style, f=zoom/100;
  r.setProperty('--cw',(56*f).toFixed(1)+'px');
  r.setProperty('--ch',(40*f).toFixed(1)+'px');
  r.setProperty('--cf',Math.max(5,9*f).toFixed(1)+'px');
  $('#zoomPct').textContent=zoom+'%';
  redrawOverlays();
}
function fitToScreen(){
  const wrap=$('#gridWrap'), card=$('#layoutCanvas'); if(!card) return;
  const availW=wrap.clientWidth-30, availH=wrap.clientHeight-30;
  const {width:w,height:h}=flowSurfaceSize(card);
  if(!w||!h) return;
  const z=zoom*Math.min(availW/w, availH/h);
  applyZoom(z);
  wrap.scrollTop=0; wrap.scrollLeft=0;
}

/* =====================================================================
   SERIE DE CÓDIGOS
===================================================================== */
function fillSerie(){
  if(!editing()){ toast('Activa el modo Editar'); return; }
  if(!sel.length){ toast('Selecciona celdas primero (Shift+clic para rango)'); return; }
  const base=prompt('Código inicial (ej: D1002):'); if(!base) return;
  const step=parseInt(prompt('Paso (ej: 2, -2, 1):','2')||'2',10); if(isNaN(step)) return;
  const m=base.trim().toUpperCase().match(/^(.*?)(\d+)$/);
  if(!m){ toast('El código debe terminar en número'); return; }
  const pre=m[1]; let num=parseInt(m[2],10); const pad=m[2].length;
  snap('Rellenar serie desde '+base.toUpperCase(),sel.length+' celdas');
  [...sel].sort((a,b)=>a.r-b.r||a.c-b.c).forEach(({r,c})=>{
    const row=cam().rows[r]; if(row.kind==='pas') return;
    let cell=row.cells[c];
    if(!cell||cell.k!=='loc') cell=row.cells[c]={k:'loc',code:'',t:'simple',skus:[],fl:{}};
    cell.code=pre+String(num).padStart(pad,'0');
    num+=step;
  });
  afterMutate(); toast('Serie aplicada');
}

/* =====================================================================
   FLUJO — flechas libres y compatibles con anclajes de versiones previas
===================================================================== */
function cellCenter(card,cardR,r,c){
  const el=card.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
  if(!el) return null;
  const b=el.getBoundingClientRect();
  return {x:b.left-cardR.left+b.width/2, y:b.top-cardR.top+b.height/2};
}
function clamp(v,min,max){ return Math.max(min,Math.min(max,v)); }
function flowSurfaceSize(card){
  const content=card.querySelector('#layoutContent');
  const box=(content||card).getBoundingClientRect();
  return {
    width:Math.max(1,box.width||card.clientWidth||1),
    height:Math.max(1,box.height||card.clientHeight||1)
  };
}
function syncOverlaySize(svg,card){
  const size=flowSurfaceSize(card);
  svg.style.width=size.width+'px';
  svg.style.height=size.height+'px';
  svg.setAttribute('width',size.width);
  svg.setAttribute('height',size.height);
  svg.setAttribute('viewBox',`0 0 ${size.width} ${size.height}`);
  return size;
}
function flowBounds(card,cardR=card.getBoundingClientRect()){
  const size=flowSurfaceSize(card);
  const cells=[...card.querySelectorAll('.cell')];
  if(!cells.length){
    return {left:0,top:0,right:size.width,bottom:size.height,width:size.width,height:size.height};
  }
  let left=Infinity,top=Infinity,right=-Infinity,bottom=-Infinity;
  cells.forEach(cell=>{
    const b=cell.getBoundingClientRect();
    left=Math.min(left,b.left-cardR.left);
    top=Math.min(top,b.top-cardR.top);
    right=Math.max(right,b.right-cardR.left);
    bottom=Math.max(bottom,b.bottom-cardR.top);
  });
  const pad=6;
  left=clamp(left+pad,0,size.width);
  top=clamp(top+pad,0,size.height);
  right=clamp(right-pad,left+1,size.width);
  bottom=clamp(bottom-pad,top+1,size.height);
  return {left,top,right,bottom,width:right-left,height:bottom-top};
}
function pointerOnCard(card,e){
  const b=card.getBoundingClientRect();
  const bounds=flowBounds(card,b);
  return {
    x:clamp(e.clientX-b.left,bounds.left,bounds.right),
    y:clamp(e.clientY-b.top,bounds.top,bounds.bottom)
  };
}
function freeEndpoint(card,p){
  const bounds=flowBounds(card);
  return {
    x:+clamp((p.x-bounds.left)/bounds.width,0,1).toFixed(6),
    y:+clamp((p.y-bounds.top)/bounds.height,0,1).toFixed(6),
    space:'layout'
  };
}
function endpointPoint(card,cardR,p){
  if(!p) return null;
  if(Number.isFinite(p.x)&&Number.isFinite(p.y)){
    const bounds=flowBounds(card,cardR);
    if(p.space==='layout') return {x:bounds.left+clamp(p.x,0,1)*bounds.width,y:bounds.top+clamp(p.y,0,1)*bounds.height};
    const size=flowSurfaceSize(card);
    return {
      x:clamp(clamp(p.x,0,1)*size.width,bounds.left,bounds.right),
      y:clamp(clamp(p.y,0,1)*size.height,bounds.top,bounds.bottom)
    };
  }
  return cellCenter(card,cardR,p.r,p.c);
}
function normalizedFlowPoint(cm,p){
  if(Number.isFinite(p?.x)&&Number.isFinite(p?.y)) return {x:clamp(p.x,0,1),y:clamp(p.y,0,1),space:'layout'};
  const rows=Math.max(1,cm.rows.length-1),cols=Math.max(1,Math.max(...cm.rows.map(row=>(row.cells||[]).length))-1);
  return {x:+clamp(nval(p?.c)/cols,0,1).toFixed(6),y:+clamp(nval(p?.r)/rows,0,1).toFixed(6),space:'layout'};
}
function flowArrowDirection(arrow){return arrow?.direction==='both'?'both':'forward';}
function flowArrowCurveMode(arrow){return ['auto','bezier'].includes(arrow?.curveMode)?arrow.curveMode:'straight';}
function defaultBezierControl(cm,arrow){
  const a=normalizedFlowPoint(cm,arrow.a),b=normalizedFlowPoint(cm,arrow.b),dx=b.x-a.x,dy=b.y-a.y,length=Math.hypot(dx,dy)||1;
  const offset=Math.min(.12,Math.max(.035,length*.16));
  return {x:+clamp((a.x+b.x)/2-dy/length*offset,0,1).toFixed(6),y:+clamp((a.y+b.y)/2+dx/length*offset,0,1).toFixed(6),space:'layout'};
}
function flowNeighborPoint(cm,index,point,side){
  const current=normalizedFlowPoint(cm,point),candidates=[];
  (cm.arrows||[]).forEach((arrow,i)=>{
    if(i===index)return;
    const direction=flowArrowDirection(arrow);
    ['a','b'].forEach(end=>{
      const joined=normalizedFlowPoint(cm,arrow[end]);
      if(Math.hypot(current.x-joined.x,current.y-joined.y)>.04)return;
      const compatible=direction==='both'||(side==='start'?end==='b':end==='a');
      const other=normalizedFlowPoint(cm,arrow[end==='a'?'b':'a']);
      candidates.push({other,compatible,distance:Math.hypot(other.x-current.x,other.y-current.y)});
    });
  });
  candidates.sort((a,b)=>Number(b.compatible)-Number(a.compatible)||b.distance-a.distance);
  return candidates[0]?.other||null;
}
function automaticFlowControls(cm,arrow,index){
  const a=normalizedFlowPoint(cm,arrow.a),b=normalizedFlowPoint(cm,arrow.b),dx=b.x-a.x,dy=b.y-a.y,length=Math.hypot(dx,dy)||1,handle=Math.min(.14,Math.max(.025,length*.28));
  const startNeighbor=flowNeighborPoint(cm,index,a,'start'),endNeighbor=flowNeighborPoint(cm,index,b,'end');
  const unit=(x,y,fallbackX,fallbackY)=>{const d=Math.hypot(x,y);return d>.0001?{x:x/d,y:y/d}:{x:fallbackX,y:fallbackY};};
  const main=unit(dx,dy,1,0);
  const incoming=startNeighbor?unit(a.x-startNeighbor.x,a.y-startNeighbor.y,main.x,main.y):main;
  const outgoing=endNeighbor?unit(endNeighbor.x-b.x,endNeighbor.y-b.y,main.x,main.y):main;
  return {
    c1:{x:clamp(a.x+incoming.x*handle,0,1),y:clamp(a.y+incoming.y*handle,0,1),space:'layout'},
    c2:{x:clamp(b.x-outgoing.x*handle,0,1),y:clamp(b.y-outgoing.y*handle,0,1),space:'layout'}
  };
}
function flowArrowGeometry(cm,arrow,index=-1){
  const a=normalizedFlowPoint(cm,arrow.a),b=normalizedFlowPoint(cm,arrow.b),mode=flowArrowCurveMode(arrow);
  if(mode==='bezier')return {mode,a,b,c:normalizedFlowPoint(cm,arrow.control||defaultBezierControl(cm,arrow))};
  if(mode==='auto'){const controls=automaticFlowControls(cm,arrow,index);return {mode,a,b,...controls};}
  return {mode:'straight',a,b};
}
function flowGeometryPoint(geometry,t){
  const u=1-t,a=geometry.a,b=geometry.b;
  if(geometry.mode==='bezier')return {x:u*u*a.x+2*u*t*geometry.c.x+t*t*b.x,y:u*u*a.y+2*u*t*geometry.c.y+t*t*b.y};

function wireFlowEditor(card){
  const svg=card.querySelector('#flowSvg');
  if(!svg) return;

  svg.addEventListener('pointerdown',e=>{
    if(!editing()||tool!=='flow'||e.button!==0) return;
    const line=e.target.closest('.arrowHit');
    const handle=e.target.closest('.arrowHandle');
    const curveHandle=e.target.closest('.curveHandle');
    const boundary=e.target.closest('.flowBoundary');
    const point=pointerOnCard(card,e);
    e.preventDefault();
    e.stopPropagation();
    svg.setPointerCapture(e.pointerId);

    if(boundary){
      flowPointDrag={pointerId:e.pointerId,kind:boundary.dataset.kind,before:JSON.stringify(state),changed:false};
      selArrow=-1;sel=[];svg.classList.add('dragging');drawFlow();return;
    }
    if(curveHandle||handle||line){
      const index=+(curveHandle||handle||line).dataset.i;
      const A=cam().arrows[index];
      const cardR=card.getBoundingClientRect();
      const a=endpointPoint(card,cardR,A.a), b=endpointPoint(card,cardR,A.b);
      if(!a||!b) return;
      selArrow=index; sel=[];
      arrowDrag={
        pointerId:e.pointerId,
        index,
        mode:curveHandle?'control':(handle?handle.dataset.end:'move'),
        start:point,
        a:{...a},
        b:{...b},
        control:A.control?endpointPoint(card,cardR,A.control):null,
        linksA:linkedFlowRefs(cam(),A.a,index,'a'),
        linksB:linkedFlowRefs(cam(),A.b,index,'b'),
        before:JSON.stringify(state),
        changed:false
      };
      svg.classList.add('dragging');
      drawFlow();
      renderInspector();
      return;
    }

    selArrow=-1; sel=[];
    arrowDraft={start:point,mouse:point,pointerId:e.pointerId};
    drawFlow();
    renderInspector();
  });

  svg.addEventListener('pointermove',e=>{
    if(e.pointerId!==(flowPointDrag?.pointerId??arrowDrag?.pointerId??arrowDraft?.pointerId)) return;
    const point=pointerOnCard(card,e);
    if(flowPointDrag){
      const next=snapBoundaryEndpoint(cam(),flowPointDrag.kind,freeEndpoint(card,point));
      cam()[flowPointDrag.kind]=next.point;flowPointDrag.snapped=next.snapped;flowPointDrag.changed=true;drawFlow();return;
    }
    if(arrowDraft){
      arrowDraft.mouse=point;
      drawFlow();
      return;
    }
    if(!arrowDrag) return;
    const A=cam().arrows[arrowDrag.index];
    if(!A) return;
    const dx=point.x-arrowDrag.start.x, dy=point.y-arrowDrag.start.y;
    if(Math.hypot(dx,dy)>1) arrowDrag.changed=true;
    if(arrowDrag.mode==='control'){
      A.curveMode='bezier';A.control=freeEndpoint(card,point);
    }else if(arrowDrag.mode==='a'){
      const next=snapConnectorEndpoint(cam(),freeEndpoint(card,point),arrowDrag.index);A.a=next.point;arrowDrag.snapped=next.snapped;applyFlowRefs(cam(),arrowDrag.linksA,A.a);
    }else if(arrowDrag.mode==='b'){
      const next=snapConnectorEndpoint(cam(),freeEndpoint(card,point),arrowDrag.index);A.b=next.point;arrowDrag.snapped=next.snapped;applyFlowRefs(cam(),arrowDrag.linksB,A.b);
    }else{
      const bounds=flowBounds(card);
      const minDx=Math.max(bounds.left-arrowDrag.a.x,bounds.left-arrowDrag.b.x);
      const maxDx=Math.min(bounds.right-arrowDrag.a.x,bounds.right-arrowDrag.b.x);
      const minDy=Math.max(bounds.top-arrowDrag.a.y,bounds.top-arrowDrag.b.y);
      const maxDy=Math.min(bounds.bottom-arrowDrag.a.y,bounds.bottom-arrowDrag.b.y);
      const tx=clamp(dx,minDx,maxDx), ty=clamp(dy,minDy,maxDy);
      A.a=freeEndpoint(card,{x:arrowDrag.a.x+tx,y:arrowDrag.a.y+ty});
      A.b=freeEndpoint(card,{x:arrowDrag.b.x+tx,y:arrowDrag.b.y+ty});
      if(arrowDrag.control)A.control=freeEndpoint(card,{x:arrowDrag.control.x+tx,y:arrowDrag.control.y+ty});
      applyFlowRefs(cam(),arrowDrag.linksA,A.a);applyFlowRefs(cam(),arrowDrag.linksB,A.b);
    }
    drawFlow();
  });

  const finish=e=>{
    if(e.pointerId!==(flowPointDrag?.pointerId??arrowDrag?.pointerId??arrowDraft?.pointerId)) return;
    if(svg.hasPointerCapture(e.pointerId)) svg.releasePointerCapture(e.pointerId);
    if(flowPointDrag){
      const drag=flowPointDrag;flowPointDrag=null;svg.classList.remove('dragging');
      if(drag.changed){pushArrowSnapshot(drag.before,drag.kind==='flowStart'?'Mover inicio del recorrido':'Mover fin del recorrido','flujo');markDirty();}
      render();return;
    }
    if(arrowDraft){
      const start=arrowDraft.start, end=pointerOnCard(card,e);
      const create=Math.hypot(end.x-start.x,end.y-start.y)>=10;
      arrowDraft=null;
      if(create){
        snap('Crear flecha de flujo','posición libre');
        const a=snapConnectorEndpoint(cam(),freeEndpoint(card,start),-1).point,b=snapConnectorEndpoint(cam(),freeEndpoint(card,end),-1).point;
        cam().arrows.push({a,b,direction:'forward',curveMode:'straight'});
        selArrow=cam().arrows.length-1;
        markDirty();
      }
      render();
      return;
    }
    if(!arrowDrag) return;
    const drag=arrowDrag;
    arrowDrag=null;
    svg.classList.remove('dragging');
    if(drag.changed){
      const label=drag.mode==='move'?'Mover conector de flujo':drag.mode==='control'?'Ajustar curva Bézier':(drag.mode==='a'?'Mover origen del conector':'Mover destino del conector');

/* =====================================================================
   MOTOR DE SLOTTING · CUBICACIÓN CON COBERTURA DE AMBAS CÁMARAS
   - Calcula en una sola corrida Congelado y Refrigerado.
   - Usa demanda, volumetría y reposiciones para asignar SKU.
   - Sólo escribe SKU: nunca crea, mueve ni cambia ubicaciones del plano.
===================================================================== */
const ENGINE_LS='slottingMotor_v1';
const ENGINE_VERSION='2.0.0';
const ENGINE_MODE='CONTROLLED_APPLY';
const ENGINE_FACTORS={simple:1,'1/2':0.5,'1/4':0.25,'1/6':1/6,reserva:1};
const ENGINE_SLOT_COUNT={simple:1,'1/2':2,'1/4':4,'1/6':6,reserva:1};
const ENGINE_TYPE_ORDER=['1/6','1/4','1/2','simple'];
const ENGINE_LAYER={0:'Base del pallet',1:'Capa media',2:'Corona del pallet'};
const ENGINE_DEFAULT={
  schemaVersion:6,
  articles:[],
  demand:[],
  aisleRestrictions:{'1':{a2:['Cecina']}},
  params:{
    palletLengthCm:120,
    palletWidthCm:100,
    palletUsableHeightCm:160,
    occupancyPct:85,
    demandPeriodDays:30,
    maxReplenishmentsPerDay:5,
    rowDistanceUnit:1,
    columnDistanceUnit:1,
    advancedOptimizationEnabled:false,
    proximityPct:34,
    primePopulationPct:33,
    demandSpreadPct:33
  },
  recommendations:[],
  diagnostics:[],
  lastRun:null,
  updatedAt:null
};
let engineState=loadEngineState();
let engineTab='resumen';
let engineDirty=false;

function engineClone(v){ return JSON.parse(JSON.stringify(v)); }
function normKey(v){ return String(v??'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,''); }
function nval(v,def=0){ const n=Number(String(v??'').trim().replace(',','.')); return Number.isFinite(n)?n:def; }
function maxReplenishmentTarget(v){ return Math.min(10,Math.max(0,Math.floor(nval(v,5)))); }
function optimizationWeightTotal(p=engineState.params){ return Math.round(nval(p.proximityPct)+nval(p.primePopulationPct)+nval(p.demandSpreadPct)); }
function optimizationEnabled(p=engineState.params){ return !!p.advancedOptimizationEnabled&&optimizationWeightTotal(p)===100; }
function boundedPct(v,def=0){ return Math.min(100,Math.max(0,Math.round(nval(v,def)))); }
function isActiveArticle(v){ const k=normKey(v); return !['0','inactivo','inactiva','bloqueado','bloqueada','no','false','eliminado','eliminada'].includes(k); }
function normalizeThermalCondition(v){
  const k=normKey(v);
  if(['congelado','congelada','congelados','frozen'].includes(k)) return 'Congelado';
  if(['refrigerado','refrigerada','refrigerados','fresco','fresca','chilled'].includes(k)) return 'Refrigerado';
  return '';
}
function cameraThermalCondition(cameraIndex){
  const name=normKey((state.cams[cameraIndex]||{}).name);
  if(name.includes('congel')) return 'Congelado';
  if(name.includes('fresc')||name.includes('refrig')) return 'Refrigerado';
  return '';
}
function slottingCameraIndexes(){
  const required=['Congelado','Refrigerado'];
  return required.map(condition=>state.cams.findIndex((_,i)=>cameraThermalCondition(i)===condition)).filter(i=>i>=0);
}
function cameraRun(cameraIndex){
  const runs=Array.isArray(engineState.lastRun?.runs)?engineState.lastRun.runs:[];
  return runs.find(run=>Number(run.cameraIndex)===Number(cameraIndex))||null;
}
function migrateArticle(a){
  const item=Object.assign({},a||{});
  item.thermalCondition=normalizeThermalCondition(item.thermalCondition||item.condicionTermica||item.cameraCondition||item.camera||item.sector);
  return item;
}
function loadEngineState(){
  try{
    if(state&&state.slottingMotor) return migrateEngine(state.slottingMotor);
    const raw=JSON.parse(localStorage.getItem(ENGINE_LS));
    if(!raw) return engineClone(ENGINE_DEFAULT);
    return migrateEngine(raw);
  }catch(e){ return engineClone(ENGINE_DEFAULT); }
}
function migrateEngine(e){
  const d=engineClone(ENGINE_DEFAULT);
  e=e&&typeof e==='object'?e:{};
  d.articles=Array.isArray(e.articles)?e.articles.map(migrateArticle):[];
  d.demand=Array.isArray(e.demand)?e.demand:[];
  d.aisleRestrictions=e.aisleRestrictions&&typeof e.aisleRestrictions==='object'&&!Array.isArray(e.aisleRestrictions)?engineClone(e.aisleRestrictions):d.aisleRestrictions;
  d.params=Object.assign(d.params,e.params||{});
  delete d.params.selectedCamera;
  d.params.maxReplenishmentsPerDay=maxReplenishmentTarget(d.params.maxReplenishmentsPerDay);
  d.params.advancedOptimizationEnabled=!!d.params.advancedOptimizationEnabled;
  d.params.proximityPct=boundedPct(d.params.proximityPct,34);
  d.params.primePopulationPct=boundedPct(d.params.primePopulationPct,33);
  d.params.demandSpreadPct=boundedPct(d.params.demandSpreadPct,33);
  if(optimizationWeightTotal(d.params)!==100){ d.params.proximityPct=34; d.params.primePopulationPct=33; d.params.demandSpreadPct=33; }
  d.recommendations=Array.isArray(e.recommendations)?e.recommendations:[];
  d.diagnostics=Array.isArray(e.diagnostics)?e.diagnostics:[];
  d.lastRun=e.lastRun&&typeof e.lastRun==='object'?e.lastRun:null;
  d.updatedAt=e.updatedAt||null;
  if(d.lastRun&&d.lastRun.engineVersion!==ENGINE_VERSION){ d.recommendations=[]; d.lastRun=null; }
  return d;
}
function syncEngineToSharedState(){ state.slottingMotor=engineClone(engineState); }
function syncEngineFromSharedState(){
  if(!state||!state.slottingMotor) return false;
  engineState=migrateEngine(state.slottingMotor);
  localStorage.setItem(ENGINE_LS,JSON.stringify(engineState));
  engineDirty=false;
  return true;
}
function markEngineDirty(){
  engineDirty=true;
  syncEngineToSharedState();
  markDirty();
  renderEngineFootState();
}
function engineParameterDraftFromForm(){
  const byId=id=>document.getElementById(id);
  if(!byId('epMaxRepos')) return null;
  const p=engineState.params;
  const bounded=(id,current,min,max,integer=false)=>{
    let value=nval(byId(id)?.value,current);
    if(integer)value=Math.floor(value);
    return Math.min(max,Math.max(min,value));
  };
  const values={
    maxReplenishmentsPerDay:maxReplenishmentTarget(byId('epMaxRepos').value),
    palletLengthCm:bounded('epLength',p.palletLengthCm,1,10000),
    palletWidthCm:bounded('epWidth',p.palletWidthCm,1,10000),
    palletUsableHeightCm:bounded('epHeight',p.palletUsableHeightCm,1,10000),
    occupancyPct:bounded('epOccupancy',p.occupancyPct,1,100),
    demandPeriodDays:bounded('epPeriod',p.demandPeriodDays,1,3650,true),
    rowDistanceUnit:bounded('epRowDist',p.rowDistanceUnit,.01,10000),
    columnDistanceUnit:bounded('epColDist',p.columnDistanceUnit,.01,10000),
    advancedOptimizationEnabled:!!byId('epAdvEnabled')?.checked,
    proximityPct:boundedPct(byId('epProximity')?.value,p.proximityPct),
    primePopulationPct:boundedPct(byId('epPopulation')?.value,p.primePopulationPct),
    demandSpreadPct:boundedPct(byId('epDemandSpread')?.value,p.demandSpreadPct)
  };
  const total=optimizationWeightTotal(values);
  return {values,total,invalid:values.advancedOptimizationEnabled&&total!==100?'Los criterios de optimización deben sumar exactamente 100%.':''};
}
function commitEngineParametersFromForm(options={}){
  const result=engineParameterDraftFromForm();
  if(!result)return {found:false,changed:false};
  if(result.invalid)return {found:true,changed:false,invalid:result.invalid,total:result.total};
  const draft=result.values;
  const changed=Object.keys(draft).some(key=>Number(engineState.params[key])!==Number(draft[key]));
  Object.assign(engineState.params,draft);
  if(changed){
    engineState.recommendations=[];
    engineState.lastRun=null;
    if(options.mark===false)syncEngineToSharedState();else markEngineDirty();
  }
  return {found:true,changed,params:engineClone(engineState.params),total:result.total};
}
function enginePersistenceSignature(engine){ return JSON.stringify(migrateEngine(engine)); }
async function persistEngine(){
  if(!canEdit()){ toast('Tu usuario es sólo visualizador'); return false; }
  try{
    const captured=commitEngineParametersFromForm();
    if(captured.invalid){ toast(captured.invalid); return false; }
    const canCalculate=engineState.articles.length>0&&engineState.demand.length>0&&slottingCameraIndexes().length===2;
    const recalculated=canCalculate&&(captured.changed||!engineState.lastRun||!engineState.recommendations.length);
    if(recalculated)calculateAllCameras();
    engineState.updatedAt=new Date().toISOString();
    syncEngineToSharedState();
    localStorage.setItem(ENGINE_LS,JSON.stringify(engineState));
    markDirty();
    const saved=await persist({silentSuccess:true});
    if(!saved)return false;
    const remote=await apiJson('/api/state');
    if(!remote.state?.slottingMotor||enginePersistenceSignature(remote.state.slottingMotor)!==enginePersistenceSignature(engineState)){
      engineDirty=true;markDirty();renderEngineFootState();
      throw new Error('la verificación central no coincide con los valores ingresados');
    }
    if(recalculated){
      engineTab='recomendaciones';
      render();
      if($('#engineBg').classList.contains('open'))renderSlottingEngine();
    }
    toast(recalculated?'Motor grabado; distribución recalculada y lista para aplicar':'Motor grabado y verificado para todos los dispositivos','ok');
    return true;
  }catch(e){ toast('No se pudo grabar el motor: '+e.message); return false; }
}
function renderEngineFootState(){

     desde la entrada y sin vulnerar jamás sector o pasillo. */
  if(advanced&&weights.demand>0){
    while(available.size){
      const pending=candidates.map(x=>{
        const chosen=assigned.get(normKey(x.a.sku))||[];
        const capacityBoxes=chosen.reduce((sum,loc)=>sum+boxesInSublocation(loc,x.a.volumeCm3),0);
        const repos=replenishmentsFor(x.daily,capacityBoxes);
        const populationBalance=1/Math.max(1,chosen.length);
        const score=weights.demand*x.demandScore+weights.population*populationBalance+weights.proximity*x.bestProximityScore;
        return {x,capacityBoxes,repos,score};
      }).filter(o=>o.capacityBoxes>0&&o.repos>0&&o.x.daily>0)
        .sort((a,b)=>b.score-a.score||b.x.daily-a.x.daily||a.repos-b.repos);
      if(!pending.length)break;
      let placed=false;
      for(const need of pending){
        const options=locations.map((loc,index)=>({loc,index,boxes:boxesInSublocation(loc,need.x.a.volumeCm3)}))
          .filter(o=>available.has(o.index)&&o.boxes>0&&locationSectorRule(o.loc,need.x.a.sector).allowed);
        if(!options.length)continue;
        const choice=chooseLocation(options,need.x,1);
        if(!choice)continue;
        assign(need.x,choice.index); placed=true; break;
      }
      if(!placed)break;
    }
  }

  const recs=[...candidates,...excluded].map(x=>{
    const chosen=assigned.get(normKey(x.a.sku))||[];
    const capacityCm3=chosen.reduce((sum,loc)=>sum+nval(loc.capacityCm3),0);
    const capacityBoxes=chosen.reduce((sum,loc)=>sum+boxesInSublocation(loc,x.a.volumeCm3),0);
    const repos=replenishmentsFor(x.daily,capacityBoxes);
    const locationRecommendations=chosen.map(loc=>{
      const locationCapacityBoxes=boxesInSublocation(loc,x.a.volumeCm3);
      const dailyDemandShare=capacityBoxes>0?x.daily*locationCapacityBoxes/capacityBoxes:0;

    });
    const valid=nval(x.a.volumeCm3)>0&&[0,1,2].includes(Number(x.a.fragility));
    const applyReady=valid&&locationRecommendations.length>0;
    const overMax=applyReady&&repos>maxRepos;
    const restrictionViolations=[];
    const restrictionViolated=false;
    const dedicatedAisles=sectorDedicatedAisles(cameraIndex,x.a.sector);
    let result,reason;
    if(!valid){

      reason=nval(x.a.volumeCm3)<=0?'El SKU no tiene dimensiones o volumen válido.':'La fragilidad debe ser 0, 1 o 2.';
    }else if(!locationRecommendations.length){
      result=dedicatedAisles.length?'Sin capacidad en pasillo autorizado':'Sin ubicación compatible';
      reason=dedicatedAisles.length
        ?`El sector ${x.a.sector||'sin sector'} sólo puede ubicarse en ${dedicatedAisles.join(', ')} y no existe capacidad compatible disponible. La restricción no se vulneró.`
        :'No existe una sububicación libre y permitida cuya volumetría admita al menos una caja.';
    }else if(overMax){
      result='Cubicado · excede máximo';
      reason=`El objetivo era ${x.minimumCapacityBoxes} caja(s) en tipo ${x.targetType}; la capacidad disponible admite ${capacityBoxes} y exige ${repos} reposición(es)/día. Se aplicará aunque supera el máximo configurado de ${maxRepos}.`;
    }else if(x.daily<=0){

      reason=`El SKU quedó en la posición mínima volumétricamente compatible (${x.targetType}) y no registra demanda positiva.`;
    }else{
      result='Cubicación completa';
      reason=`Objetivo ${x.minimumCapacityBoxes} caja(s), tipo mínimo ${x.targetType}; se asignaron ${locationRecommendations.length} ubicación(es) con capacidad para ${capacityBoxes}. Reposiciones/día = techo(${fmtNum(x.daily,2)} ÷ ${capacityBoxes}) − 1 = ${repos}.${advanced?' Optimización ponderada activa: cercanía '+p.proximityPct+'%, poblamiento prime '+p.primePopulationPct+'%, demanda '+p.demandSpreadPct+'%.':''}`;
    }
    if(!applyReady) diagnostics.push(`Motor: ${x.a.sku} · ${result}`);
    if(overMax) diagnostics.push(`Motor: ${x.a.sku} · ${repos} reposiciones/día, sobre el máximo ${maxRepos}; aplicación autorizada por regla.`);
    if(!applyReady&&dedicatedAisles.length) diagnostics.push(`Motor: ${x.a.sku} · sin capacidad en los pasillos autorizados ${dedicatedAisles.join(', ')}; no se usaron excepciones.`);
    return {
      sku:x.a.sku,name:x.a.name,sector:x.a.sector,thermalCondition:normalizeThermalCondition(x.a.thermalCondition),status:x.a.status,fragility:Number(x.a.fragility),layer:fragLayer(x.a.fragility),
      boxVolumeCm3:x.a.volumeCm3,demandBoxes:x.d.boxes,periodDays:x.d.periodDays,orderLines:x.d.orderLines,dailyDemand:x.daily,
      minimumCapacityBoxes:x.minimumCapacityBoxes,requiredVolumeCm3:x.requiredVolumeCm3,targetType:x.targetType,targetLocationCount:x.targetLocationCount,
      recommendedType:[...new Set(locationRecommendations.map(loc=>loc.type))].join(' + ')||'—',positionsNeeded:locationRecommendations.length,locations:locationRecommendations,
      averageDistance:locationRecommendations.length?locationRecommendations.reduce((sum,loc)=>sum+loc.distance,0)/locationRecommendations.length:null,
      capacityCm3,capacityBoxes,replenishmentsPerDay:Number.isFinite(repos)?repos:null,maxReplenishmentsPerDay:maxRepos,
      overMax,restrictionViolated,restrictionViolationCount:restrictionViolations.length,dedicatedAisles,result,reason,applyReady,currentLocations:currentSkuLocations(x.a.sku)
    };
  }).sort((x,y)=>y.dailyDemand-x.dailyDemand||String(x.sku).localeCompare(String(y.sku),'es'));

  engineState.recommendations=recs;
  engineState.diagnostics=diagnostics;
  engineState.lastRun={
    at:new Date().toISOString(),engineVersion:ENGINE_VERSION,mode:ENGINE_MODE,cameraIndex,cameraName:(state.cams[cameraIndex]||state.cams[0]).name,targetThermal,
    articleCount:recs.length,targetArticleCount:targetArticles.length,sublocationCount:locations.length,
    physicalLocationCount:new Set(locations.map(loc=>loc.row+':'+loc.column)).size,applicableCount:recs.filter(r=>r.applyReady).length,
    overMaxCount:recs.filter(r=>r.overMax).length,restrictionViolationCount:recs.filter(r=>r.restrictionViolated).length,restrictionSignature:engineRestrictionSignature(cameraIndex),layoutSignature:engineLayoutSignature(cameraIndex)
  };

}
function calculateAllCameras(){
  const cameraIndexes=slottingCameraIndexes();
  const combined=[], diagnostics=[], runs=[];
  cameraIndexes.forEach(cameraIndex=>{
    const recs=calculateEngine({cameraIndex});
    const run=engineClone(engineState.lastRun);
    runs.push(run);
    diagnostics.push(...engineState.diagnostics);
    recs.forEach(rec=>combined.push({...rec,cameraIndex,cameraName:run.cameraName}));
  });
  const covered=new Set(runs.map(run=>normalizeThermalCondition(run.targetThermal)));
  ['Congelado','Refrigerado'].forEach(condition=>{
    if(!covered.has(condition)) diagnostics.push(`Motor: falta una cámara reconocida para ${condition}. La corrida exige cubrir ambas cámaras.`);
  });
  engineState.recommendations=combined.sort((a,b)=>a.cameraIndex-b.cameraIndex||b.dailyDemand-a.dailyDemand||String(a.sku).localeCompare(String(b.sku),'es'));
  engineState.diagnostics=[...new Set(diagnostics)];
  engineState.lastRun={
    at:new Date().toISOString(),engineVersion:ENGINE_VERSION,mode:ENGINE_MODE,scope:'BOTH_CAMERAS',runs,
    cameraIndexes:runs.map(run=>run.cameraIndex),cameraNames:runs.map(run=>run.cameraName),
    articleCount:combined.length,targetArticleCount:runs.reduce((sum,run)=>sum+Number(run.targetArticleCount||0),0),
    sublocationCount:runs.reduce((sum,run)=>sum+Number(run.sublocationCount||0),0),
    physicalLocationCount:runs.reduce((sum,run)=>sum+Number(run.physicalLocationCount||0),0),
    applicableCount:combined.filter(rec=>rec.applyReady).length,overMaxCount:combined.filter(rec=>rec.overMax).length,
    restrictionViolationCount:combined.filter(rec=>rec.restrictionViolated).length
  };
  markEngineDirty();
  return engineClone(engineState.recommendations);
}
function cubingReadiness(){
  const recs=engineState.recommendations||[], blockers=recs.filter(r=>!r.applyReady);
  const seen=new Set();
  const duplicateMaster=engineState.articles.some(a=>{ const key=normKey(a.sku); if(!key) return false; if(seen.has(key)) return true; seen.add(key); return false; });
  const missingThermal=engineState.articles.some(a=>isActiveArticle(a.status)&&!normalizeThermalCondition(a.thermalCondition));
  const targetKeys=new Set(recs.map(r=>normKey(r.sku))), seenDemand=new Set();
  const invalidDemand=engineState.demand.some(d=>{
    const key=normKey(d.sku);
    if(!targetKeys.has(key)) return false;
    const invalid=seenDemand.has(key)||nval(d.boxes)<0||nval(d.periodDays)<=0;
    seenDemand.add(key);
    return invalid;
  });
  const runs=Array.isArray(engineState.lastRun?.runs)?engineState.lastRun.runs:[];
  const completeCoverage=runs.length===2&&['Congelado','Refrigerado'].every(condition=>runs.some(run=>normalizeThermalCondition(run.targetThermal)===condition));
  const stale=!completeCoverage||runs.some(run=>run.layoutSignature!==engineLayoutSignature(Number(run.cameraIndex))||run.restrictionSignature!==engineRestrictionSignature(Number(run.cameraIndex)));
  const incompleteTarget=Number(engineState.lastRun?.targetArticleCount)!==recs.length;
  return {ready:recs.length>0&&!blockers.length&&!duplicateMaster&&!missingThermal&&!invalidDemand&&!stale&&!incompleteTarget&&completeCoverage,blockers,duplicateMaster,missingThermal,invalidDemand,stale,incompleteTarget,completeCoverage};
}
function applyCubingRecommendations(options={}){
  if(!canEdit()) return {applied:false,mode:ENGINE_MODE,message:'Tu usuario es sólo visualizador.'};
  const check=cubingReadiness();
  if(!check.ready){
    const reason=check.stale?'El plano cambió después del cálculo. Vuelve a calcular.':
      check.duplicateMaster?'El maestro contiene SKU duplicados.':
      check.missingThermal?'Hay SKU activos sin condición térmica válida.':
      check.invalidDemand?'La demanda de la cámara contiene períodos, cantidades o SKU duplicados inválidos.':
      check.blockers.length?`${check.blockers.length} SKU no tiene una ubicación volumétricamente compatible.`:
      'No existe una cubicación completa y vigente para ambas cámaras.';
    return {applied:false,mode:ENGINE_MODE,message:reason};
  }
  const runs=engineState.lastRun.runs, assignmentsByCamera=new Map();
  runs.forEach(run=>{
    const cameraIndex=Number(run.cameraIndex), cm=state.cams[cameraIndex];
    const assignments=new Map();
    cm.rows.forEach((row,r)=>(row.cells||[]).forEach((cell,column)=>{
      if(cell&&cell.k==='loc'&&cell.t!=='reserva') assignments.set(r+':'+column,Array(skuCapacityForType(cell.t)).fill(''));
    }));
    assignmentsByCamera.set(cameraIndex,assignments);
  });
  for(const rec of engineState.recommendations){
    for(const loc of rec.locations||[]){
      const assignments=assignmentsByCamera.get(Number(loc.cameraIndex));
      const values=assignments?.get(loc.row+':'+loc.column), index=Number(loc.subslotIndex)-1;
      if(!values||index<0||index>=values.length||values[index]) return {applied:false,mode:ENGINE_MODE,message:`Conflicto de capacidad en ${sublocationLabel(loc)}. Vuelve a calcular.`};
      values[index]=String(rec.sku);
    }
  }
  const over=engineState.recommendations.filter(r=>r.overMax).length;
  const coverage=runs.map(run=>`${run.cameraName}: ${engineState.recommendations.filter(rec=>Number(rec.cameraIndex)===Number(run.cameraIndex)).length} SKU`).join(' · ');
  if(!options.skipConfirmation&&!confirm(
    `Se poblarán ambas cámaras en una sola aplicación (${coverage}). `+
    `${over?over+' SKU superará(n) el máximo de reposiciones dentro de sus pasillos autorizados. ':''}`+
    'Sólo cambiarán los SKU asignados; códigos, tipos, geometría, reservas y flechas permanecerán intactos. ¿Continuar?'
  )) return {applied:false,cancelled:true,mode:ENGINE_MODE,message:'Aplicación cancelada.'};
  snap('Aplicar cubicación','Ambas cámaras');
  runs.forEach(run=>{
    const cameraIndex=Number(run.cameraIndex), cm=state.cams[cameraIndex], assignments=assignmentsByCamera.get(cameraIndex);
    cm.rows.forEach((row,r)=>(row.cells||[]).forEach((cell,column)=>{
      if(!cell||cell.k!=='loc'||cell.t==='reserva') return;
      const values=assignments.get(r+':'+column)||[];
      while(values.length&&!values[values.length-1]) values.pop();
      cell.skus=values;
    }));
  });
  sel=[]; selArrow=-1; afterMutate();
  return {applied:true,mode:ENGINE_MODE,cameraIndexes:runs.map(run=>run.cameraIndex),skuCount:engineState.recommendations.length,sublocationCount:engineState.recommendations.reduce((sum,r)=>sum+(r.locations||[]).length,0),overMaxCount:over,restrictionViolationCount:sectorExceptions,message:'Cubicación aplicada en congelado y refrigerado. Revisa ambos planos y presiona Grabar; la distribución, las restricciones y los datos del motor quedarán disponibles para todos los usuarios.'};
}
function engineCameraSummary(cameraIndex){
  const targetThermal=cameraThermalCondition(cameraIndex);
  const thermalSku=engineState.articles.filter(a=>isActiveArticle(a.status)&&normalizeThermalCondition(a.thermalCondition)===targetThermal).length;
  const recommendations=engineState.recommendations.filter(rec=>Number(rec.cameraIndex)===Number(cameraIndex)).length;
  return {cameraIndex,cameraName:(state.cams[cameraIndex]||{}).name||'Cámara no disponible',targetThermal,thermalSku,locations:engineLocations(cameraIndex).length,recommendations,aisles:engineAisles(cameraIndex).length,restrictions:Object.keys(cameraAisleRestrictions(cameraIndex)).length};
}
function engineSummary(){
  const cameras=slottingCameraIndexes().map(engineCameraSummary);
  const active=engineState.articles.filter(a=>isActiveArticle(a.status)).length;
  const demandSku=new Set(engineState.demand.filter(d=>d.boxes>0).map(d=>normKey(d.sku))).size;

function wireSlottingEngine(){
  $('#engineX').onclick=closeSlottingEngine; $('#engineClose').onclick=closeSlottingEngine; $('#engineSave').onclick=persistEngine;
  document.querySelectorAll('[data-etab]').forEach(b=>b.onclick=()=>{ commitEngineParametersFromForm(); engineTab=b.dataset.etab; renderSlottingEngine(); });
  $('#engineExportConfig').onclick=exportEngineJson; $('#engineImportConfig').onclick=()=>$('#engineConfigInp').click();
  const byId=id=>document.getElementById(id);
  if(byId('eMasterTemplate')) byId('eMasterTemplate').onclick=downloadMasterTemplate;
  if(byId('eMasterLoad')) byId('eMasterLoad').onclick=()=>$('#engineMasterInp').click();
  if(byId('eMasterExport')) byId('eMasterExport').onclick=exportMasterCsv;
  if(byId('eDemandTemplate')) byId('eDemandTemplate').onclick=downloadDemandTemplate;
  if(byId('eDemandLoad')) byId('eDemandLoad').onclick=()=>$('#engineDemandInp').click();
  if(byId('eDemandExport')) byId('eDemandExport').onclick=exportDemandCsv;
  const refreshOptimizationForm=()=>{
    if(!byId('epAdvEnabled'))return;
    byId('eAdvancedPanel').classList.toggle('on',byId('epAdvEnabled').checked);
    const proximity=boundedPct(byId('epProximity').value),population=boundedPct(byId('epPopulation').value),demand=boundedPct(byId('epDemandSpread').value);
    byId('epProximityValue').textContent=proximity;
    byId('epPopulationValue').textContent=population;
    byId('epDemandSpreadValue').textContent=demand;
    const total=proximity+population+demand;
    byId('epWeightTotal').textContent='Total: '+total+'%';
    byId('epWeightTotal').classList.toggle('bad',total!==100);
  };
  if(byId('epAdvEnabled')) byId('epAdvEnabled').onchange=refreshOptimizationForm;
  ['epProximity','epPopulation','epDemandSpread'].forEach(id=>{ if(byId(id))byId(id).oninput=refreshOptimizationForm; });
  ['epMaxRepos','epLength','epWidth','epHeight','epOccupancy','epPeriod','epRowDist','epColDist'].forEach(id=>{
    if(byId(id))byId(id).oninput=()=>commitEngineParametersFromForm();
  });
  if(byId('eParamsSave')) byId('eParamsSave').onclick=async()=>{
    const captured=commitEngineParametersFromForm();
    if(captured.invalid){ toast(captured.invalid); return; }
    if(await persistEngine()){if(engineState.recommendations.length)engineTab='recomendaciones';renderSlottingEngine();}
  };
  if(byId('eRestrictionsSave')) byId('eRestrictionsSave').onclick=()=>{
    const nextByCamera=Object.fromEntries(slottingCameraIndexes().map(cameraIndex=>[String(cameraIndex),{}]));
    document.querySelectorAll('[data-aisle-restriction]').forEach(input=>{
      const sectors=[...new Set(String(input.value||'').split(',').map(v=>v.trim()).filter(Boolean))];
      const cameraIndex=String(input.dataset.cameraIndex), next=nextByCamera[cameraIndex]||(nextByCamera[cameraIndex]={});
      if(sectors.length) next[input.dataset.aisleRestriction]=sectors;
    });
    engineState.aisleRestrictions=Object.assign({},engineState.aisleRestrictions||{},nextByCamera);
    engineState.recommendations=[]; engineState.lastRun=null; markEngineDirty(); renderSlottingEngine();
    toast('Restricciones de ambas cámaras actualizadas; vuelve a calcular','ok');
  };
  if(byId('eRun')) byId('eRun').onclick=()=>{
    if(!engineState.articles.length){ toast('Primero carga el maestro de artículos'); engineTab='maestro'; renderSlottingEngine(); return; }
    const cameras=slottingCameraIndexes();
    if(cameras.length!==2){ toast('Deben existir una cámara de Congelado y una de Refrigerado para ejecutar el motor'); return; }
    if(!confirm(`Se calcularán en una sola corrida ${(state.cams[cameras[0]]||{}).name} y ${(state.cams[cameras[1]]||{}).name}. El plano no cambiará hasta presionar “Aplicar ambas cámaras”. ¿Continuar?`)) return;
    calculateAllCameras(); render(); engineTab='recomendaciones'; renderSlottingEngine(); toast('Cubicación calculada para ambas cámaras','ok');
  };
  if(byId('eApply')) byId('eApply').onclick=()=>{
    const result=applyCubingRecommendations();
    if(result.applied){ renderSlottingEngine(); toast(result.message,'ok'); }
    else if(!result.cancelled) toast(result.message);
  };
  if(byId('eRecExport')) byId('eRecExport').onclick=exportRecommendationsCsv;
  if(byId('eRecJson')) byId('eRecJson').onclick=exportEngineJson;
  wireHeatTab();
}

window.SlottingMotor=Object.freeze({
  version:ENGINE_VERSION,
  mode:ENGINE_MODE,
  importarMaestro:text=>importMasterText(text),
  importarDemanda:text=>importDemandText(text),
  configurar:params=>{
    const next=Object.assign({},params||{});
    delete next.selectedCamera;
    const candidate=Object.assign({},engineState.params,next);
    candidate.maxReplenishmentsPerDay=maxReplenishmentTarget(candidate.maxReplenishmentsPerDay);
    candidate.advancedOptimizationEnabled=!!candidate.advancedOptimizationEnabled;
    candidate.proximityPct=boundedPct(candidate.proximityPct,engineState.params.proximityPct);
    candidate.primePopulationPct=boundedPct(candidate.primePopulationPct,engineState.params.primePopulationPct);
    candidate.demandSpreadPct=boundedPct(candidate.demandSpreadPct,engineState.params.demandSpreadPct);
    if(candidate.advancedOptimizationEnabled&&optimizationWeightTotal(candidate)!==100) throw new Error('Los criterios de optimización deben sumar exactamente 100%.');
    engineState.params=candidate;
    engineState.recommendations=[];
    engineState.lastRun=null;
    markEngineDirty();

}

let openMenu=null;
function showMenu(name,rootEl){
  const dd=$('#mdrop');
  document.querySelectorAll('.mroot').forEach(m=>m.classList.toggle('open',m.dataset.m===name));
  const items=MENUS[name]();
  dd.innerHTML='';
  items.forEach(it=>{
    if(it==='-'){ dd.appendChild(document.createElement('hr')); return; }
    const [label,acc,fn,enabled,checked]=it;
    const b=document.createElement('button');
    b.innerHTML=(checked?'<span class="chk">✓</span>':'')+esc(label)+(acc?`<span class="acc">${acc}</span>`:'');
    b.disabled=!enabled;
    b.onclick=()=>{ hideMenus(); fn(); };
    dd.appendChild(b);
  });
  dd.style.visibility='hidden';
  dd.style.right='auto';
  dd.style.left='0px';
  dd.style.minWidth='0px';
  const barR=$('#menubar').getBoundingClientRect();
  dd.style.width=Math.max(220,Math.min(320,barR.width-12,window.innerWidth-16))+'px';
  dd.style.display='block';
  const rootR=rootEl.getBoundingClientRect();
  const desired=rootR.left-barR.left,available=Math.max(6,barR.width-dd.offsetWidth-6);
  dd.style.left=Math.max(6,Math.min(desired,available))+'px';
  dd.style.visibility='visible';
  openMenu=name;
}
function hideMenus(){ $('#mdrop').style.display='none'; document.querySelectorAll('.mroot').forEach(m=>m.classList.remove('open')); openMenu=null; }
document.querySelectorAll('.mroot').forEach(m=>{
  m.addEventListener('mousedown',e=>{ e.stopPropagation(); openMenu===m.dataset.m?hideMenus():showMenu(m.dataset.m,m); });
  m.addEventListener('mouseenter',()=>{ if(openMenu&&openMenu!==m.dataset.m) showMenu(m.dataset.m,m); });
});
document.addEventListener('mousedown',e=>{ if(openMenu&&!e.target.closest('.menubar')) hideMenus(); });

===================================================================== */
function setMode(m){
  if(m==='edit'&&!canEdit()) return;
  if(m===mainMode) return;
  if(m==='view'&&dirty){
    openModal('Cambios sin grabar',
      `<p style="font-size:12px;line-height:1.5">Hay cambios pendientes de grabar. Puedes grabarlos ahora o continuar al modo consulta manteniéndolos en memoria (se perderán si cierras la página sin grabar).</p>`,
      `<button class="tbtn" id="wCancel">Cancelar</button>
       <button class="tbtn" id="wNoSave">Continuar sin grabar</button>
       <button class="tbtn" id="wSave" style="font-weight:700">Grabar y continuar</button>`);
    $('#wCancel').onclick=closeModal;
    $('#wNoSave').onclick=()=>{ closeModal(); doSetMode('view'); };
    $('#wSave').onclick=async()=>{ if(await persist()){ closeModal(); doSetMode('view'); } };
    return;
  }
  doSetMode(m);
}
function doSetMode(m){
  mainMode=m;
  if(m==='view'){ tool='sel'; painting=false; cancelArrowGesture(); selArrow=-1; }
  render();
}
$('#modeView').onclick=()=>setMode('view');
$('#modeEdit').onclick=()=>setMode('edit');

document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){ e.preventDefault(); if(canEdit()) persist(); return; }
  if(e.target.matches('input,textarea,select')) {
    if(e.key==='Escape') e.target.blur();
    return;
  }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!e.shiftKey){ e.preventDefault(); undo(); }
  if((e.ctrlKey||e.metaKey)&&(e.key.toLowerCase()==='y'||(e.shiftKey&&e.key.toLowerCase()==='z'))){ e.preventDefault(); redo(); }
  if(e.key==='Delete'&&editing()&&tool==='flow'&&selArrow>=0){ snap('Eliminar flecha','flecha '+(selArrow+1)); cam().arrows.splice(selArrow,1); selArrow=-1; afterMutate(); }
  if(e.key==='Escape'){ sel=[]; selArrow=-1; cancelArrowGesture(); closeCtx(); closeModal(); closeSlottingEngine(); hideHeatTip(); hideMenus(); if(panelOpen){ panelOpen=null; } render(); }
});

/* =====================================================================
   INICIO
===================================================================== */
async function bootstrapApp(){
  try{
    let migrationChanged=false;
    const session=await apiJson('/api/auth/me');
    authUser=session.user;
    $('#userBadge').textContent=authUser.username.toUpperCase()+' · '+(canEdit()?'ADMIN':'VISUALIZADOR');
    const saved=await apiJson('/api/state');
    cloudHasState=Boolean(saved.state);
    if(saved.state){
      const issues=validateStructure(saved.state);
      if(issues.length&&(!Array.isArray(saved.state.cams)||!saved.state.cams.length)) throw new Error('El plano compartido no tiene una estructura válida');
      state=saved.state;
      migrationChanged=migrate(state);
      // La configuración se conserva, pero una ejecución anterior no debe
      // bloquear la apertura: el movimiento se inicia sólo desde su botón.
      if(state.pickerSimulation?.enabled) state.pickerSimulation.enabled=false;
      syncEngineFromSharedState();
      structIssues=issues;
      localStorage.setItem(LS_KEY,JSON.stringify(state));
      lastSaved=saved.updatedAt?new Date(saved.updatedAt):null;
      lastSavedBy=saved.updatedBy||'';
    }else if(!canEdit()){
      state=freshState();
    }
    migrationChanged=syncHeatFromSharedState()||migrationChanged;
    mainMode='view';
    dirty=false;
    updateSaveUI();
    applyZoom(100);
    render();
    renderSearchUI();
    if(migrationChanged&&canEdit()){
      dirty=true; updateSaveUI();
      if(await persist()) toast('Configuración de módulos y reservas N1 actualizada','ok');
    }
    if(!cloudHasState&&canEdit()){
      dirty=true; updateSaveUI();
      if(await persist({silentSuccess:true})) toast('Plano inicial guardado en ChatGPT Sites','ok');
    }
  }catch(err){
    document.body.innerHTML=`<div style="display:grid;place-items:center;height:100%;padding:24px;font:13px Segoe UI;background:#dce4ef;color:#7d1f18">
      <div style="max-width:460px;padding:20px;border:1px solid #be746d;background:#fff"><b>No fue posible abrir WAS ON.</b><br><br>${esc(err.message)}</div>
    </div>`;
  }
}
bootstrapApp();
