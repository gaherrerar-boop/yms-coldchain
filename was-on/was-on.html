<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>WAS ON</title>
  <link rel="icon" href="/favicon.svg">
  <style>
    :root{color-scheme:light;background:#fff6e6;font-family:Poppins,Montserrat,"Segoe UI",Arial,sans-serif;--brand-blue:#003087;--brand-orange:#e87722;--brand-ivory:#fff6e6;--brand-white:#fff}
    *{box-sizing:border-box}html,body{width:100%;min-width:320px;height:100%;margin:0;overflow:hidden}body{background:var(--brand-ivory);color:var(--brand-blue)}button,input{font:inherit}
    .login-screen{display:grid;min-height:100dvh;place-items:center;padding:24px;background-color:var(--brand-ivory);background-image:linear-gradient(rgba(0,48,135,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(0,48,135,.07) 1px,transparent 1px);background-size:36px 36px}.login-card{width:min(430px,100%);overflow:hidden;border:1px solid rgba(0,48,135,.15);border-radius:18px;background:var(--brand-white);box-shadow:0 26px 70px rgba(0,48,135,.17)}
    .login-card:before{content:"";display:block;height:5px;background:var(--brand-orange)}.login-titlebar{display:flex;align-items:center;gap:14px;padding:24px 26px 20px;border-bottom:1px solid rgba(0,48,135,.1)}.brand-mark{display:grid;width:44px;height:44px;place-items:center;flex:0 0 auto;border-radius:11px;color:var(--brand-ivory);background:var(--brand-blue);font-size:24px;box-shadow:inset 0 -3px 0 var(--brand-orange)}.login-titlebar h1{margin:0;color:var(--brand-blue);font-size:23px;font-weight:800;letter-spacing:-.3px}.login-titlebar p{margin:3px 0 0;color:rgba(0,48,135,.68);font-size:13px}
    .login-form{display:grid;gap:8px;padding:24px 26px 18px}.login-form label{margin-top:4px;color:var(--brand-blue);font-size:12px;font-weight:700}.login-form input{width:100%;height:46px;padding:0 13px;border:1px solid rgba(0,48,135,.24);border-radius:9px;outline:none;color:var(--brand-blue);background:var(--brand-white)}.login-form input:hover{border-color:rgba(0,48,135,.42)}.login-form input:focus{border-color:var(--brand-blue);box-shadow:0 0 0 3px rgba(0,48,135,.12)}.login-form button,.session-bar button{border:1px solid var(--brand-blue);border-radius:9px;color:var(--brand-ivory);background:var(--brand-blue);font-weight:700;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease,background .15s ease}.login-form button{height:46px;margin-top:12px;box-shadow:0 6px 14px rgba(0,48,135,.18)}.login-form button:hover{background:#00266c;box-shadow:0 8px 18px rgba(0,48,135,.24);transform:translateY(-1px)}.login-form button:disabled{cursor:wait;opacity:.65;transform:none}.login-error{display:none;margin:4px 0 0;padding:10px 11px;border-left:4px solid var(--brand-orange);border-radius:7px;color:var(--brand-blue);background:var(--brand-ivory);font-size:12px}.login-error.visible{display:block}
    .login-note{display:grid;gap:6px;padding:0 26px 24px;color:rgba(0,48,135,.62);font-size:11px;text-align:center}.login-note strong{color:var(--brand-blue)}.loading-card{display:flex;min-height:124px;align-items:center;justify-content:center;gap:14px;padding:25px;color:var(--brand-blue)}.loading-card .brand-mark{animation:brandPulse 1.25s ease-in-out infinite}@keyframes brandPulse{50%{transform:translateY(-2px);box-shadow:inset 0 -3px 0 var(--brand-orange),0 8px 18px rgba(0,48,135,.18)}}
    .site-shell{display:none;width:100%;height:100dvh;grid-template-rows:34px minmax(0,1fr)}.session-bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 10px 0 16px;border-bottom:2px solid var(--brand-orange);color:var(--brand-ivory);background:var(--brand-blue);font-size:10px}.session-bar div{display:flex;min-width:0;align-items:baseline;gap:14px}.session-bar strong{display:none}.session-bar span{overflow:hidden;color:rgba(255,246,230,.78);text-overflow:ellipsis;white-space:nowrap}.session-bar button{min-width:104px;height:25px;border-color:rgba(255,246,230,.48);background:transparent;font-size:9px}.session-bar button:hover{background:var(--brand-orange);border-color:var(--brand-orange)}.slotting-app{display:block;width:100%;height:100%;min-height:0;border:0;background:var(--brand-ivory)}.hidden{display:none!important}@media(max-width:600px){.login-screen{padding:14px}.session-bar span{display:none}}
  </style>
</head>
<body>
  <main id="loading" class="login-screen"><section class="login-card loading-card"><span class="brand-mark">▦</span><p>Iniciando WAS ON…</p></section></main>
  <main id="login" class="login-screen hidden"><section class="login-card"><div class="login-titlebar"><span class="brand-mark">▦</span><div><h1>WAS ON</h1><p>Gestión de ubicaciones</p></div></div><form id="loginForm" class="login-form"><label for="username">Usuario</label><input id="username" autocomplete="username" value="ON" required autofocus><label for="password">Contraseña</label><input id="password" type="password" autocomplete="current-password" required><p id="loginError" class="login-error" role="alert"></p><button id="loginButton" type="submit">Ingresar</button></form><div class="login-note"><span>Datos compartidos y guardados en ChatGPT Sites.</span><span>Acceso inicial: <strong>ON / 123</strong></span></div></section></main>
  <main id="shell" class="site-shell"><header class="session-bar"><div><strong>WAS ON</strong><span id="sessionLabel"></span></div><button id="logoutButton" type="button">Cerrar sesión</button></header><iframe id="slottingFrame" class="slotting-app" title="WAS ON"></iframe></main>
  <script src="/local-api.js"></script>
  <script>
    const loading=document.getElementById('loading'),login=document.getElementById('login'),shell=document.getElementById('shell'),frame=document.getElementById('slottingFrame');
    const loginForm=document.getElementById('loginForm'),loginButton=document.getElementById('loginButton'),loginError=document.getElementById('loginError');
    function showLogin(message=''){loading.classList.add('hidden');shell.style.display='none';login.classList.remove('hidden');loginError.textContent=message;loginError.classList.toggle('visible',Boolean(message));document.getElementById('password').value='';}
    function showApp(user){loading.classList.add('hidden');login.classList.add('hidden');shell.style.display='grid';document.getElementById('sessionLabel').textContent='Usuario: '+user.username.toUpperCase()+' · '+(user.role==='admin'?'Administrador':'Visualizador');if(!frame.src)frame.src='/slotting.html?v=netlify-1';}
    async function verifySession(){const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),8000);try{const response=await fetch('/api/auth/me',{cache:'no-store',signal:controller.signal});if(!response.ok)return showLogin();showApp((await response.json()).user);}catch(error){showLogin(error&&error.name==='AbortError'?'La validación demoró demasiado. Puedes ingresar manualmente.':'No fue posible validar la sesión.');}finally{clearTimeout(timeout);}}
    loginForm.addEventListener('submit',async event=>{event.preventDefault();loginButton.disabled=true;loginButton.textContent='Ingresando…';loginError.classList.remove('visible');try{const response=await fetch('/api/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:document.getElementById('username').value,password:document.getElementById('password').value})});const data=await response.json();if(!response.ok)throw new Error(data.error||'No fue posible iniciar sesión.');showApp(data.user);}catch(error){showLogin(error instanceof Error?error.message:'No fue posible iniciar sesión.');}finally{loginButton.disabled=false;loginButton.textContent='Ingresar';}});
    document.getElementById('logoutButton').addEventListener('click',()=>{window.top.location.href='/signout-with-chatgpt?return_to=/';});verifySession();
  </script>
</body>
</html>
